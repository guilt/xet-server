openapi: 3.0.3
info:
  title: Xet Server API
  version: 0.8.0
  description: |
    HTTP APIs exposed by `xetd`: a wire-compatible Xet CAS server
    (`internal/casserver`, mounted at `/v1` and `/v2`), an optional Hub API
    shim (`internal/hubserver`, mounted on a separate port via `-hub-addr`)
    that lets the real `hf` CLI talk to this server end-to-end, and the Xet
    Data API (`internal/api`, mounted at `/v1` alongside the CAS protocol,
    on a disjoint set of literal paths) - a simple, non-wire-compatible
    chunk/dedup API for quick manual testing via the `xet` CLI.

    ## Authentication

    Every endpoint except telemetry/storage-stats (CAS) and `/v1/stats`
    (Xet Data API) is gated by a pluggable `auth.Authenticator`,
    defaulting to no enforcement at all (this server's pre-v0.8.0
    behavior). Enabled via `xetd -auth-token <secret>` (or
    `$XETD_AUTH_TOKEN`/`$HF_TOKEN`), which installs a single shared bearer
    token checked against every request:

    - **401 Unauthorized** - no `Authorization` header, or a token that
      fails validation entirely (wrong token, malformed header).
    - **403 Forbidden** - a valid token that lacks the scope (`read` or
      `write`) the endpoint requires, or a token minted for a different
      repository than the one named in the route. The shared secret is
      unrestricted; only minted tokens carry a repo binding.

    In this UI, use **Authorize** and paste the same secret the server was
    started with; it is sent as `Authorization: Bearer <token>` on every
    "Try it out" call. If the server has no auth configured you can skip
    this entirely - the token is ignored either way.

    ## Trying endpoints from this page

    The server entry is relative, so "Try it out" always targets whichever
    host and port you loaded these docs from - no configuration needed, on
    a remote host or a non-default port.

    This spec documents two APIs that run on two listeners, and **both
    serve these docs**, so open the one whose endpoints you want to call:

    - `http://<host>:<addr-port>/api-docs/` - CAS protocol + Xet Data API
    - `http://<host>:<hub-addr-port>/api-docs/` - Hub API shim

    Endpoints belonging to the *other* listener are still documented on
    whichever page you open (it is one spec), but calling them from here
    would be cross-origin and the browser will block it - this server
    sends no CORS headers by design, since a permissive policy would let
    any website you visit issue authenticated requests to your local
    server. Switch to the other port's `/api-docs/` page, or use `curl` /
    the `hf` CLI. Every request and response shape documented here is
    exact either way.

    See `internal/auth`'s package doc for the `Authenticator`/`Principal`
    (server-side) and `CredentialHelper` (client-side) interfaces -
    implementing either lets a custom auth backend work with this server's
    existing routes unmodified.
  license:
    name: See repository LICENSE
servers:
  # A single relative URL, deliberately. It resolves against whatever
  # origin these docs were loaded from, so "Try it out" targets the right
  # server with no configuration - on a remote host, behind a reverse
  # proxy, or on a non-default -addr/-hub-addr.
  #
  # Both listeners serve /api-docs/ (see cmd/xetd and cmd/xet-proxyd), so
  # the API you can exercise is simply the one belonging to the port you
  # loaded this page from: open it on -addr for CAS + Xet Data API, or on
  # -hub-addr for the Hub API. That keeps every call same-origin, which is
  # what makes it work at all - this server sends no CORS headers, since a
  # permissive policy would let any site the operator happens to visit
  # drive their local server.
  #
  # Listing absolute URLs here instead (http://localhost:8420) would aim
  # the browser at that port on the machine running the BROWSER - right
  # only when that is also the server. A templated entry using OpenAPI
  # server variables is no better: Swagger UI renders it as a literal
  # placeholder with variable input boxes, which is noise rather than
  # help. One relative entry is both correct and the least confusing.
  - url: /
    description: This server - whichever host/port you loaded these docs from.
tags:
  - name: CAS
    description: >-
      Wire-compatible Xet Content-Addressable Storage protocol
      (hf_xet/xet-core clients speak this directly), mounted at /v1 and /v2.
  - name: Hub
    description: >-
      Hub API shim (huggingface_hub-compatible), mounted on a separate port
      via -hub-addr. Lets the real `hf` CLI work end-to-end against xetd.
  - name: Xet Data
    description: >-
      Simple, non-wire-compatible chunk/dedup API for manual testing via
      the `xet` CLI. Mounted at /v1 alongside the CAS protocol, on a
      disjoint set of literal paths (upload, files/{id}, stats) that never
      collide with the CAS protocol's own /v1 routes.
security:
  - bearerAuth: []
components:
  responses:
    Unauthorized:
      description: No credential, or one that fails validation entirely.
      content:
        text/plain:
          schema: { type: string }
    Forbidden:
      description: Valid credential, but lacking the scope this endpoint requires.
      content:
        text/plain:
          schema: { type: string }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        Optional. Only enforced if xetd was started with -auth-token (or
        $XETD_AUTH_TOKEN/$HF_TOKEN) set to something other than "None". A
        server with no auth configured accepts every request regardless of
        whether this header is present.
  schemas:
    ErrorResponse:
      type: object
      description: >-
        casserver's plain-text error body (Content-Type: text/plain via
        http.Error) is NOT this shape - only hubserver and the Xet Data
        API's JSON error paths use this. See each endpoint's response for
        its actual error content-type.
      properties:
        error:
          type: string
      required: [error]
    IndexRange:
      type: object
      description: Chunk-index range; End is exclusive.
      properties:
        start: { type: integer, format: int64 }
        end: { type: integer, format: int64 }
      required: [start, end]
    ByteRange:
      type: object
      description: Byte range; End is inclusive.
      properties:
        start: { type: integer, format: int64 }
        end: { type: integer, format: int64 }
      required: [start, end]
    UploadXorbResponse:
      type: object
      properties:
        was_inserted:
          type: boolean
          description: false if this xorb hash was already stored (dedup hit).
      required: [was_inserted]
    UploadShardResponse:
      type: object
      properties:
        result:
          type: integer
          description: >-
            0 = already exists, 1 = SyncPerformed. This server always
            returns 1 (it has no separate shard-dedup store).
      required: [result]
    ReconstructionTerm:
      type: object
      properties:
        hash: { type: string, description: Xorb hash (hex) this term reads from. }
        range: { $ref: '#/components/schemas/IndexRange' }
        unpacked_length: { type: integer, format: int64 }
      required: [hash, range, unpacked_length]
    FetchInfoEntry:
      type: object
      properties:
        url: { type: string, format: uri }
        url_range: { $ref: '#/components/schemas/ByteRange' }
        range: { $ref: '#/components/schemas/IndexRange' }
      required: [url, url_range, range]
    ReconstructionResponseV1:
      type: object
      properties:
        offset_into_first_range: { type: integer, format: int64 }
        terms:
          type: array
          items: { $ref: '#/components/schemas/ReconstructionTerm' }
        fetch_info:
          type: object
          description: Keyed by xorb hash (hex).
          additionalProperties:
            type: array
            items: { $ref: '#/components/schemas/FetchInfoEntry' }
      required: [offset_into_first_range, terms, fetch_info]
    XorbRangeDescriptor:
      type: object
      properties:
        chunks: { $ref: '#/components/schemas/IndexRange' }
        bytes: { $ref: '#/components/schemas/ByteRange' }
      required: [chunks, bytes]
    XorbMultiRangeFetch:
      type: object
      properties:
        url: { type: string, format: uri }
        ranges:
          type: array
          items: { $ref: '#/components/schemas/XorbRangeDescriptor' }
      required: [url, ranges]
    ReconstructionResponseV2:
      type: object
      properties:
        offset_into_first_range: { type: integer, format: int64 }
        terms:
          type: array
          items: { $ref: '#/components/schemas/ReconstructionTerm' }
        xorbs:
          type: object
          description: Keyed by xorb hash (hex).
          additionalProperties:
            type: array
            items: { $ref: '#/components/schemas/XorbMultiRangeFetch' }
      required: [offset_into_first_range, terms, xorbs]
    StorageStatsResponse:
      type: object
      properties:
        eviction_enabled: { type: boolean }
        budget_bytes: { type: integer, format: int64 }
        evictions_total: { type: integer, format: int64 }
        bytes_freed_total: { type: integer, format: int64 }
      required: [eviction_enabled]
    GCRequest:
      type: object
      properties:
        keep:
          type: array
          items: { type: string }
          description: Hex SHA-256 OIDs of the files to keep (case-insensitive).
        grace_seconds:
          type: integer
          format: int64
          description: Overrides the server's -gc-grace for this run; 0 means no grace.
        dry_run: { type: boolean }
      required: [keep]
    GCReport:
      type: object
      properties:
        dry_run: { type: boolean }
        grace_seconds: { type: integer, format: int64 }
        keep_oids: { type: integer }
        keep_unknown: { type: integer, description: Listed OIDs no shard describes. }
        keep_unknown_sample: { type: array, items: { type: string } }
        files_kept: { type: integer }
        files_recent: { type: integer, description: Kept only because their shard arrived within the grace. }
        files_dropped: { type: integer }
        shards_kept: { type: integer }
        shards_rewritten: { type: integer }
        shards_deleted: { type: integer }
        xorbs_kept: { type: integer }
        xorbs_kept_bytes: { type: integer, format: int64 }
        xorbs_deleted: { type: integer }
        xorbs_deleted_bytes: { type: integer, format: int64 }
        xorbs_deferred: { type: integer, description: Unreferenced but inside the grace or being fetched. }
        xorbs_deferred_bytes: { type: integer, format: int64 }
        errors: { type: array, items: { type: string } }
      required: [dry_run, grace_seconds, keep_oids, keep_unknown, files_kept, files_recent, files_dropped, shards_kept, shards_rewritten, shards_deleted, xorbs_kept, xorbs_kept_bytes, xorbs_deleted, xorbs_deleted_bytes, xorbs_deferred, xorbs_deferred_bytes]
    CreateRepoRequest:
      type: object
      properties:
        name: { type: string }
        organization: { type: string }
        type: { type: string, description: 'Defaults to "model" if empty.' }
      required: [name]
    CreateRepoResponse:
      type: object
      properties:
        url: { type: string, description: 'Resolved repo ID, e.g. "org/name".' }
      required: [url]
    XetTokenResponse:
      type: object
      properties:
        casUrl: { type: string, format: uri }
        exp: { type: integer, format: int64, description: Unix seconds. }
        accessToken: { type: string }
      required: [casUrl, exp, accessToken]
    RepoInfoResponse:
      type: object
      description: >-
        Small subset of the real Hub's ModelInfo/DatasetInfo/SpaceInfo
        shape. snapshot_download reads `sha` to pin the revision and
        `siblings` to enumerate files; both matter (see siblings).
      properties:
        id: { type: string, description: 'The repo ID, e.g. "org/name".' }
        sha:
          type: string
          description: >-
            Set to the revision name itself (e.g. "main"), not a real git
            commit hash - this shim has no separate commit-hash identity
            for a revision distinct from its name.
        private: { type: boolean }
        siblings:
          type: array
          description: >-
            Every file committed to this revision. Must be non-empty for a
            repo that has files: huggingface_hub's snapshot_download treats
            an empty siblings list as unreliable and falls back to
            list_repo_tree, which yields a GENERATOR - and tqdm's
            thread_map then raises "min() arg is an empty sequence" on an
            iterable of unknown length, before downloading anything. Only
            rfilename is read off each entry.
          items: { $ref: '#/components/schemas/RepoSibling' }
      required: [id, sha]
    RepoSibling:
      type: object
      description: One file in a repo revision, as listed by repo-info's siblings array.
      properties:
        rfilename: { type: string, description: 'Path of the file within the repo, e.g. "model.gguf".' }
      required: [rfilename]
    LFSBatchRequest:
      type: object
      description: >-
        git-LFS batch request body. Only operation and objects are read;
        clients also send transfers/hash_algo/ref, which are ignored.
      properties:
        operation:
          type: string
          description: Only "upload" is accepted; anything else is a 400.
          example: upload
        transfers:
          type: array
          description: >-
            Transfer types the client supports. Informational here - this
            server always answers "xet" - but a client that did not offer
            "xet" ignores the choice and falls back to plain LFS.
          items: { type: string }
          example: [basic, multipart, xet]
        objects:
          type: array
          description: >-
            One entry per file being negotiated. Capped per batch; a larger
            array is rejected with 413 rather than truncated, since
            silently dropping entries would leave the client believing
            files were negotiated that never were. Real clients batch 256
            (huggingface_hub's UPLOAD_BATCH_MAX_NUM_FILES).
          items: { $ref: '#/components/schemas/LFSBatchObject' }
      required: [operation, objects]
    LFSBatchObject:
      type: object
      description: One file's git-LFS identity - its plain SHA-256 and byte size.
      properties:
        oid: { type: string, description: 'Plain SHA-256 of the file (hex), NOT the Xet/Merkle hash.' }
        size: { type: integer, format: int64 }
      required: [oid, size]
    LFSBatchResponse:
      type: object
      description: >-
        Batch response selecting the Xet transfer. Objects are echoed
        back unchanged; per-object `actions` are omitted deliberately (see
        the endpoint description).
      properties:
        transfer:
          type: string
          enum: [xet]
          description: Always "xet" - this server stores files only as Xet xorbs.
        objects:
          type: array
          items: { $ref: '#/components/schemas/LFSBatchObject' }
      required: [transfer, objects]
    TreeEntry:
      type: object
      description: >-
        One element of the tree-listing response array - deserialized by
        huggingface_hub's RepoFile. type is always "file"; this shim has
        no folder concept.
      properties:
        type: { type: string, enum: [file] }
        path: { type: string }
        size: { type: integer, format: int64 }
        oid: { type: string, description: Plain SHA-256 hex, as declared in the original commit. }
        xetHash: { type: string, description: 'Optional; omitted unless already known to this shim.' }
      required: [type, path, size, oid]
    CommitLfsFileValue:
      type: object
      properties:
        path: { type: string }
        oid: { type: string, description: Plain SHA-256 hex. }
        size: { type: integer, format: int64 }
      required: [path, oid, size]
    CommitResponse:
      type: object
      properties:
        commitOid: { type: string, description: 40 hex characters. }
        commitUrl: { type: string }
        pullRequestUrl: { type: string }
      required: [commitOid, commitUrl]
    PreuploadRequestFile:
      type: object
      properties:
        path: { type: string }
        size: { type: integer, format: int64 }
      required: [path, size]
    PreuploadRequest:
      type: object
      properties:
        files:
          type: array
          items: { $ref: '#/components/schemas/PreuploadRequestFile' }
    PreuploadFileInfo:
      type: object
      properties:
        path: { type: string }
        uploadMode:
          type: string
          enum: [lfs, regular]
          description: '"regular" if size == 0, else "lfs".'
        shouldIgnore: { type: boolean }
        oid: { type: string, description: Never populated by this server. }
      required: [path, uploadMode, shouldIgnore]
    PreuploadResponse:
      type: object
      properties:
        files:
          type: array
          items: { $ref: '#/components/schemas/PreuploadFileInfo' }
      required: [files]
    UploadResult:
      type: object
      properties:
        file_id: { type: string }
        name: { type: string }
        size: { type: integer, format: int64 }
        sha256: { type: string }
        chunks_total: { type: integer }
        chunks_new: { type: integer }
        bytes_stored: { type: integer, format: int64 }
        bytes_on_wire: { type: integer, format: int64 }
        dedup_percent:
          type: number
          format: double
          description: '100 * (1 - bytes_stored/size); 0 if size is 0.'
      required:
        - file_id
        - size
        - sha256
        - chunks_total
        - chunks_new
        - bytes_stored
        - bytes_on_wire
        - dedup_percent
    ChunkRef:
      type: object
      properties:
        hash: { type: string }
        offset: { type: integer, format: int64 }
        length: { type: integer }
      required: [hash, offset, length]
    Manifest:
      type: object
      properties:
        file_id: { type: string }
        size: { type: integer, format: int64 }
        sha256: { type: string }
        chunks:
          type: array
          items: { $ref: '#/components/schemas/ChunkRef' }
      required: [file_id, size, sha256, chunks]
    XetDataStatsResponse:
      type: object
      properties:
        unique_chunks: { type: integer, format: int64 }
        unique_chunk_bytes: { type: integer, format: int64 }
        files_stored: { type: integer, format: int64 }
      required: [unique_chunks, unique_chunk_bytes, files_stored]
paths:
  /v1/xorbs/{prefix}/{hash}:
    post:
      tags: [CAS]
      summary: Upload a serialized xorb
      description: >-
        Requires write scope. {prefix} must be the literal "default".
        Body is opaque binary (chunk headers + compressed payloads, no
        footer - see internal/xorbformat), capped at 128 MiB.
      parameters:
        - { name: prefix, in: path, required: true, schema: { type: string, enum: [default] } }
        - { name: hash, in: path, required: true, schema: { type: string }, description: Merkle xorb hash, hex. }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: Uploaded (or already present - see was_inserted).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadXorbResponse' }
        '400':
          description: >-
            Bad prefix/hash, malformed xorb, unsupported/failed
            decompression, or hash mismatch between URL and computed
            content hash.
          content: { text/plain: { schema: { type: string } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413':
          description: Body exceeds the 128 MiB max xorb size.
          content: { text/plain: { schema: { type: string } } }
        '500':
          description: Storage or internal failure.
          content: { text/plain: { schema: { type: string } } }
    get:
      tags: [CAS]
      summary: Fetch raw xorb bytes
      description: >-
        Requires read scope. Supports a single-range `Range: bytes=<start>-<end>`
        header (both bounds required - no open-ended or multi-range
        requests). Byte-serving endpoint backing the URLs handed out in
        reconstruction fetch_info.
      parameters:
        - { name: prefix, in: path, required: true, schema: { type: string, enum: [default] } }
        - { name: hash, in: path, required: true, schema: { type: string } }
        - name: Range
          in: header
          required: false
          schema: { type: string, example: 'bytes=0-1023' }
      responses:
        '200':
          description: Full xorb bytes (no Range header sent).
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '206':
          description: Partial content for a satisfiable Range request.
          headers:
            Content-Range: { schema: { type: string, example: 'bytes 0-1023/2048' } }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '400':
          description: Bad prefix/hash.
          content: { text/plain: { schema: { type: string } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Unknown xorb hash.
        '416':
          description: Malformed or unsatisfiable Range header.
        '500':
          description: Storage read failure.
          content: { text/plain: { schema: { type: string } } }
    head:
      tags: [CAS]
      summary: Fetch xorb size
      description: >-
        Requires read scope. Note (source-verified, undocumented elsewhere):
        unlike GET/POST on this same path, this handler does NOT validate
        {prefix} against "default" - any prefix value is accepted.
      parameters:
        - { name: prefix, in: path, required: true, schema: { type: string } }
        - { name: hash, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Xorb exists.
          headers:
            Content-Length: { schema: { type: integer, format: int64 } }
        '400':
          description: Bad hash.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Unknown xorb hash.
  /v1/shards:
    post:
      tags: [CAS]
      summary: Upload a serialized shard
      description: >-
        Requires write scope. Body is opaque binary (file-info + xorb-info
        sections, no footer - see internal/shardformat), capped at 16 MiB,
        buffered in full before parsing.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: Shard accepted and indexed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadShardResponse' }
        '400':
          description: Malformed shard.
          content: { text/plain: { schema: { type: string } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413':
          description: Body exceeds the 16 MiB max shard size.
          content: { text/plain: { schema: { type: string } } }
  /v1/reconstructions/{file_id}:
    get:
      tags: [CAS]
      summary: File to xorb/chunk-range reconstruction map (V1)
      description: >-
        Requires read scope. Supports the same single-range Range header
        semantics as xorb fetch, applied against the file's total unpacked
        size.
      parameters:
        - { name: file_id, in: path, required: true, schema: { type: string } }
        - name: Range
          in: header
          required: false
          schema: { type: string, example: 'bytes=0-1023' }
      responses:
        '200':
          description: Reconstruction map for the full file or requested range.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReconstructionResponseV1' }
        '400':
          description: Bad file_id.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Unknown file_id.
        '416':
          description: Malformed or unsatisfiable Range header.
        '500':
          description: Reconstruction references an unknown xorb, or fetch-URL build failed.
  /v2/reconstructions/{file_id}:
    get:
      tags: [CAS]
      summary: File to xorb/chunk-range reconstruction map (V2, multi-range-optimized)
      description: >-
        Requires read scope. Same underlying data as V1, grouped by xorb
        hash (xorbs) instead of one fetch_info entry per term - fewer
        signed URLs when a file's reconstruction touches the same xorb
        across multiple non-contiguous terms. Same Range/416 semantics as V1.
      parameters:
        - { name: file_id, in: path, required: true, schema: { type: string } }
        - name: Range
          in: header
          required: false
          schema: { type: string, example: 'bytes=0-1023' }
      responses:
        '200':
          description: Reconstruction map for the full file or requested range.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReconstructionResponseV2' }
        '400':
          description: Bad file_id.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Unknown file_id.
        '416':
          description: Malformed or unsatisfiable Range header.
        '500':
          description: Reconstruction references an unknown xorb, or fetch-URL build failed.
  /v1/chunks/{prefix}/{hash}:
    get:
      tags: [CAS]
      summary: Global chunk-dedup lookup
      description: >-
        Requires read scope. {prefix} may be "default-merkledb" (the
        documented value) or "default" (what xet-core >= 1.5 clients
        actually send). Returns a complete, xorb-only shard FILE whose
        chunk hashes are keyed with a fresh random key in the footer
        (chunk_hash_hmac_key): a client can match only chunks it already
        holds. No file-reconstruction entries are included. This is the
        real wire contract per xet-core's own OpenAPI spec and
        export_as_keyed_shard.
      parameters:
        - { name: prefix, in: path, required: true, schema: { type: string, enum: [default-merkledb, default] } }
        - { name: hash, in: path, required: true, schema: { type: string }, description: Chunk hash, hex. }
      responses:
        '200':
          description: Complete keyed, xorb-only shard file that referenced this chunk hash.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '400':
          description: Bad prefix/hash.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No uploaded shard has ever referenced this chunk hash.
  /v1/telemetry:
    post:
      tags: [CAS]
      summary: No-op telemetry ack
      description: >-
        Never gated by auth, regardless of server configuration - a
        fire-and-forget client diagnostic with nothing sensitive to
        protect. Request body is ignored entirely.
      security: []
      responses:
        '200':
          description: Always succeeds.
  /v1/storage-stats:
    get:
      tags: [CAS]
      summary: Eviction/storage policy stats
      description: >-
        Never gated by auth, regardless of server configuration.
        Operator-facing; not part of the real Xet CAS API.
      security: []
      responses:
        '200':
          description: Current storage/eviction stats.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StorageStatsResponse' }
  /v1/gc:
    post:
      tags: [CAS]
      summary: Garbage collection by keep set (operator; `xetd gc`)
      description: >-
        Requires the `admin` scope, which only the operator's shared
        secret carries (no minted token does; with no auth configured
        every request has it). Not part of the real Xet CAS API, and
        mounted by `xetd` only - never by `xet-proxyd`, which is a cache
        and bounds itself with eviction. Keeps every file whose SHA-256
        OID the body lists plus every file the Hub shim's registry
        lists, drops all other files from the shards, deletes every xorb
        no kept file references, and snapshots. A xorb uploaded,
        fetched or advertised in a dedup answer within the grace period
        is never deleted, and a shard that arrived within it keeps its
        files: xet clients dedup from their own cache for three weeks
        without asking. Refused (409) with `-sync-folder`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GCRequest' }
      responses:
        '200':
          description: What the run did, or (dry_run) would do.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GCReport' }
        '400':
          description: Malformed body.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Disabled on this server (synced-folder mode).
        '501':
          description: The storage backend cannot enumerate and delete blobs.
  /api/repos/create:
    post:
      tags: [Hub]
      summary: Create (or no-op re-touch) a repo
      description: Requires write scope. Idempotent - repeat calls with the same name are no-ops.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRepoRequest' }
      responses:
        '200':
          description: Repo exists.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateRepoResponse' }
        '400':
          description: Invalid body or missing name.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/{repo_type}s/{repo_id}/revision/{revision}:
    get:
      tags: [Hub]
      summary: Repo info at a revision (resolve revision before listing/downloading)
      description: >-
        Requires read scope. huggingface_hub's snapshot_download calls
        this before list_repo_tree/per-file downloads (`hf download
        REPO_ID` with no filename); `hf upload`'s CLI command also calls
        it to check whether a target --revision already exists before
        creating it. A missing revision returns 404 with
        X-Error-Code: RevisionNotFound - required for huggingface_hub to
        raise its specific RevisionNotFoundError instead of a generic,
        uncaught error.
      parameters:
        - { name: repo_type, in: path, required: true, schema: { type: string }, example: model }
        - { name: repo_id, in: path, required: true, schema: { type: string }, example: alice/my-model }
        - { name: revision, in: path, required: true, schema: { type: string }, example: main }
      responses:
        '200':
          description: Repo/revision info.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RepoInfoResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Unknown revision (repo is implicitly created on first touch, but a revision is not).
          headers:
            X-Error-Code: { schema: { type: string, enum: [RevisionNotFound] } }
  /api/{repo_type}s/{repo_id}/tree/{revision}:
    get:
      tags: [Hub]
      summary: List every file committed to a revision
      description: >-
        Requires read scope. huggingface_hub's list_repo_tree, called
        with recursive=True by snapshot_download to enumerate files
        before downloading a whole repo. Response is a bare JSON array
        (not an object wrapping one) - huggingface_hub's paginate() helper
        does `yield from r.json()`. An optional trailing path segment
        (.../tree/{revision}/{path_in_repo}) scopes the listing to files
        under that path; omitted here since this shim's only tested
        caller (recursive, root-level) never sends one.
      parameters:
        - { name: repo_type, in: path, required: true, schema: { type: string }, example: model }
        - { name: repo_id, in: path, required: true, schema: { type: string }, example: alice/my-model }
        - { name: revision, in: path, required: true, schema: { type: string }, example: main }
      responses:
        '200':
          description: Every file committed to this revision (or under path_in_repo, if given), sorted by path.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TreeEntry' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Unknown revision.
          headers:
            X-Error-Code: { schema: { type: string, enum: [RevisionNotFound] } }
  /api/{repo_type}s/{repo_id}/branch/{branch}:
    post:
      tags: [Hub]
      summary: Create a branch (revision)
      description: >-
        Requires write scope. Called by `hf upload`'s CLI command after
        a revision-info lookup reports the target --revision doesn't
        exist yet. Idempotent, matching real create_branch(exist_ok=True)
        - repeat calls for the same branch name are harmless no-ops. This
        shim's revisions already spring into existence implicitly on
        first commit; this just does the same thing eagerly, in response
        to an explicit request.
      parameters:
        - { name: repo_type, in: path, required: true, schema: { type: string }, example: model }
        - { name: repo_id, in: path, required: true, schema: { type: string }, example: alice/my-model }
        - { name: branch, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                startingPoint: { type: string, description: Ignored by this shim. }
      responses:
        '200':
          description: Branch created (or already existed).
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/{repo_type}s/{repo_id}/xet-read-token/{revision}:
    get:
      tags: [Hub]
      summary: Issue a CAS endpoint + bearer token (read)
      description: >-
        Requires read scope. The issued token is bound to this repo (type
        and ID are inside the signed payload) and expires; presenting it on
        another repo's route is 403. Functionally identical to the
        write-token endpoint below except for which scope gates it.
      parameters:
        - { name: repo_type, in: path, required: true, schema: { type: string }, example: model }
        - { name: repo_id, in: path, required: true, schema: { type: string }, example: alice/my-model }
        - { name: revision, in: path, required: true, schema: { type: string }, example: main }
      responses:
        '200':
          description: Token issued.
          headers:
            X-Xet-Cas-Url: { schema: { type: string } }
            X-Xet-Access-Token: { schema: { type: string } }
            X-Xet-Token-Expiration: { schema: { type: string }, description: Unix seconds, decimal string. }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/XetTokenResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500':
          description: Random token generation failed.
  /api/{repo_type}s/{repo_id}/xet-write-token/{revision}:
    get:
      tags: [Hub]
      summary: Issue a CAS endpoint + bearer token (write)
      description: Requires write scope and a credential scoped to this repo (or the unrestricted shared secret). See xet-read-token - identical response shape and repo binding.
      parameters:
        - { name: repo_type, in: path, required: true, schema: { type: string }, example: model }
        - { name: repo_id, in: path, required: true, schema: { type: string }, example: alice/my-model }
        - { name: revision, in: path, required: true, schema: { type: string }, example: main }
      responses:
        '200':
          description: Token issued.
          headers:
            X-Xet-Cas-Url: { schema: { type: string } }
            X-Xet-Access-Token: { schema: { type: string } }
            X-Xet-Token-Expiration: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/XetTokenResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500':
          description: Random token generation failed.
  /api/{repo_type}s/{repo_id}/commit/{revision}:
    post:
      tags: [Hub]
      summary: Commit file entries to a revision
      description: >-
        Requires write scope. Body is ndjson, one JSON object per line;
        only lines with key "lfsFile" are recorded (others, e.g. "header",
        are skipped). Scanner buffer capped at 10 MiB per line. Creates the
        named revision implicitly if it doesn't already exist.
      parameters:
        - { name: repo_type, in: path, required: true, schema: { type: string } }
        - { name: repo_id, in: path, required: true, schema: { type: string } }
        - { name: revision, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/x-ndjson:
            schema:
              type: string
              description: >-
                Newline-delimited JSON. Each line: {"key": "lfsFile",
                "value": <CommitLfsFileValue>} (or any other key, ignored).
              example: |
                {"key":"header","value":{"summary":"a commit"}}
                {"key":"lfsFile","value":{"path":"model.bin","oid":"abc123...","size":500000}}
      responses:
        '200':
          description: Commit recorded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommitResponse' }
        '400':
          description: Invalid ndjson line, or a line exceeded the 10 MiB buffer.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500':
          description: Random commit OID generation failed.
  /api/{repo_type}s/{repo_id}/preupload/{revision}:
    post:
      tags: [Hub]
      summary: Negotiate per-file upload mode
      description: >-
        Requires write scope. Stateless - repo_type/repo_id/revision path
        segments are parsed but not used by this handler.
      parameters:
        - { name: repo_type, in: path, required: true, schema: { type: string } }
        - { name: repo_id, in: path, required: true, schema: { type: string } }
        - { name: revision, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PreuploadRequest' }
      responses:
        '200':
          description: Upload mode per file.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PreuploadResponse' }
        '400':
          description: Invalid body.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /{repo_id}.git/info/lfs/objects/batch:
    post:
      tags: [Hub]
      summary: git-LFS batch negotiation (entry point to the Xet upload path)
      description: >-
        Requires write scope. Despite the git-LFS URL, this is how a real
        client enters the XET upload path: huggingface_hub offers the
        server ["basic", "multipart", "xet"] and branches on the transfer
        it picks, so answering "xet" here is what routes the client into
        _upload_xet_files (xet-write-token + hf_xet upload to CAS). A
        server without this endpoint gets no Xet upload traffic at all -
        the client falls back to plain LFS and fails. Files below
        huggingface_hub's ~5 MB LFS threshold are committed inline and
        never reach this endpoint.


        Per-object `actions` are deliberately absent from the response:
        _validate_batch_actions requires only oid+size, and the Xet path
        ignores actions entirely, re-deriving everything from the
        xet-write-token plus the local file.


        Accepts the same optional repo-type prefix as resolve
        (datasets/..., spaces/...). The body must be exactly one JSON
        value - trailing data is rejected rather than silently ignored -
        and is bounded in both byte size and object count, since the
        response echoes every object back.
      parameters:
        - { name: repo_id, in: path, required: true, schema: { type: string }, example: alice/my-model }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LFSBatchRequest' }
      responses:
        '200':
          description: Transfer negotiated as "xet"; objects echoed back.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LFSBatchResponse' }
        '400':
          description: >-
            Malformed JSON, trailing data after the JSON value, a
            non-"upload" operation, or a repo_id whose namespace/name is
            empty.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '405':
          description: Method other than POST.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '413':
          description: Body over the size cap, or more objects than the per-batch cap.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  /{repo_id}/resolve/{revision}/{filename}:
    head:
      tags: [Hub]
      summary: File metadata (triggers the Xet download path)
      description: >-
        Requires read scope. huggingface_hub's HEAD call is what triggers
        the Xet download path client-side: it looks for X-Xet-Hash plus
        X-Xet-Refresh-Route, and downloads via hf_xet instead of calling
        GET on this same URL.


        Models use this bare path; datasets and spaces carry a repo-type
        prefix (datasets/{repo_id}/resolve/... and
        spaces/{repo_id}/resolve/...). The prefix is parsed by locating
        "/resolve/" and reading the two segments before it as
        namespace/name, so an unrecognized prefix degrades to "model"
        rather than 404ing. repo_type also determines the
        X-Xet-Refresh-Route returned below, which lives under /api/ and so
        is always typed (e.g. /api/datasets/...).
      parameters:
        - { name: repo_id, in: path, required: true, schema: { type: string }, example: alice/my-model }
        - { name: revision, in: path, required: true, schema: { type: string }, example: main }
        - { name: filename, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: File metadata.
          headers:
            X-Repo-Commit: { schema: { type: string } }
            ETag: { schema: { type: string } }
            X-Linked-Etag: { schema: { type: string } }
            X-Linked-Size: { schema: { type: string } }
            Content-Length: { schema: { type: string } }
            X-Xet-Hash: { schema: { type: string } }
            X-Xet-Refresh-Route: { schema: { type: string, format: uri } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: >-
            Revision doesn't exist, filename not committed, or the file's
            SHA-256/size isn't known to CAS yet (shard not uploaded).
    get:
      tags: [Hub]
      summary: File metadata + unimplemented direct download
      description: >-
        Requires read scope. Same lookups/headers/404s as HEAD, but never
        actually serves file bytes - always 501 once metadata is found.
        Real clients use the Xet download path signaled by the headers
        instead of calling GET here.
      parameters:
        - { name: repo_id, in: path, required: true, schema: { type: string } }
        - { name: revision, in: path, required: true, schema: { type: string } }
        - { name: filename, in: path, required: true, schema: { type: string } }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Same conditions as HEAD.
        '501':
          description: Direct GET not supported; use the Xet download path via X-Xet-Hash.
          content: { text/plain: { schema: { type: string } } }
  /v1/upload:
    post:
      tags: [Xet Data]
      summary: Chunk, dedup, and store a file
      description: Requires write scope.
      parameters:
        - { name: name, in: query, required: false, schema: { type: string }, description: Echoed back in the response; not used for storage/hashing. }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: Upload summary.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500':
          description: Storage or manifest write failure.
  /v1/files/{id}:
    get:
      tags: [Xet Data]
      summary: Download a previously-uploaded file
      description: >-
        Requires read scope. No Range header support - always streams the
        full file.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Full file bytes.
          headers:
            Content-Length: { schema: { type: integer, format: int64 } }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Unknown or invalid file id.
        '500':
          description: A chunk referenced by the manifest is missing.
  /v1/files/{id}/manifest:
    get:
      tags: [Xet Data]
      summary: Fetch a file's chunk manifest
      description: Requires read scope.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Manifest.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Manifest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Unknown or invalid file id.
  /v1/stats:
    get:
      tags: [Xet Data]
      summary: Store-wide dedup stats
      description: Never gated by auth, regardless of server configuration.
      security: []
      responses:
        '200':
          description: Current stats.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/XetDataStatsResponse' }
